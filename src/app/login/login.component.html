
<form #loginform="ngForm" (ngSubmit)="onSubmit(loginform)">

  <label for="username">Name</label>
  <input
    id="username"
    type="text"
    name="username"
    [(ngModel)]="username"
    required
  >

  <label for="password">Password</label>
  <input
    id="password"
    type="password"
    name="password"
    [(ngModel)]="password"
    required
  >

  <button type="submit">Submit</button>

</form>
